<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">

    <!-- 1. Importazione di React, ReactDOM e Babel tramite CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <header>
        <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <!-- Punto di montaggio per il componente React -->
        <div class="lista-animali"></div>
    </main>
    <footer>
        <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>

    <!-- Codice React -->
    <script type="text/babel">
        const { useState } = React;

        // Componente Modal espanso (Milestone 3)
        function Modal({
            title,
            content,
            show = false,
            onClose = () => { },
            onConfirm = () => { }
        }) {
            return show && ReactDOM.createPortal(
                <div className="modal-container">
                    <div className="modal">
                        <h2>{title}</h2>
                        <div>{content}</div>
                        <div style={{ marginTop: "15px", display: "flex", gap: "10px" }}>
                            <button onClick={onClose}>Annulla</button>
                            <button onClick={onConfirm}>Conferma</button>
                        </div>
                    </div>
                </div>,
                document.body
            );
        }

        const ListaAnimali = () => {
            const [animals, setAnimals] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [newAnimal, setNewAnimal] = useState("");

            // Conferma: aggiunge l'animale alla lista, svuota l'input e chiude la modale
            const handleConfirm = () => {
                if (newAnimal.trim() !== "") {
                    setAnimals(prevAnimals => [...prevAnimals, newAnimal.trim()]);
                    setNewAnimal("");
                    setShowModal(false);
                }
            };

            // Annulla: svuota l'input e chiude la modale senza modificare la lista
            const handleClose = () => {
                setNewAnimal("");
                setShowModal(false);
            };

            return (
                <>
                    <button onClick={() => setShowModal(true)}>Aggiungi Animale</button>

                    <details>
                        <summary>Animali</summary>
                        <ul>
                            {animals.map((animal, index) => (
                                <li key={index}>{animal}</li>
                            ))}
                        </ul>
                    </details>

                    <Modal
                        title="Aggiungi un nuovo animale"
                        show={showModal}
                        onClose={handleClose}
                        onConfirm={handleConfirm}
                        content={
                            <input
                                type="text"
                                placeholder="Inserisci il nome dell'animale..."
                                value={newAnimal}
                                onChange={(e) => setNewAnimal(e.target.value)}
                            />
                        }
                    />
                </>
            );
        };

        // Seleziona l'elemento con classe .lista-animali e monta il componente
        const container = document.querySelector('.lista-animali');
        const root = ReactDOM.createRoot(container);
        root.render(<ListaAnimali />);
    </script>
</body>

</html>
