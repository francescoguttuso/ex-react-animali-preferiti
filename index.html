<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">

    <!-- 1. Importazione di React, ReactDOM e Babel tramite CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <header>
        <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <!-- Punto di montaggio per il componente React -->
        <div class="lista-animali"></div>
    </main>
    <footer>
        <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>

    <!-- Codice React  -->
    <script type="text/babel">
        const ListaAnimali = () => {
            // Array statico di stringhe
            const animals = ["Gatto", "Pappagallo", "Cane", "Tartaruga", "Coniglio"];

            return (
                <details>
                    <summary>Animali</summary>
                    <ul>
                        {animals.map((animal, index) => (
                            <li key={index}>{animal}</li>
                        ))}
                    </ul>
                </details>
            );
        };

        // Seleziona l'elemento con classe .lista-animali e monta il componente
        const container = document.querySelector('.lista-animali');
        const root = ReactDOM.createRoot(container);
        root.render(<ListaAnimali />);
    </script>
</body>

</html>
